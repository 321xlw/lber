h1 {

}

.item {

}

.count-text {

/* 分页样式 */
.pagination {

  cursor: pointer;
  color: #333;
}
.pagination a.active {
  background: #409eff;
  color: #fff;
  border-color: #409eff;

/* 平板：一行3张 */

/* 手机：一行1张，图片自适应 */

  body {
    padding: 20px 3%;

async function saveCountData() {

  try {
    // 先获取文件的 sha 值
    const getRes = await fetch(url, {

    // 提交更新
    await fetch(url, {
      method: "PUT",
      headers: {
        Authorization: `token ${TOKEN}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: "更新下载次数",
        content: btoa(unescape(encodeURIComponent(JSON.stringify(globalCountData, null, 2)))),
        sha: sha
      })
    });
  } catch (e) {
    console.error("保存计数失败：", e);
  }
}

// 点击下载 +1
async function addDownload(id) {
  if (!globalCountData[id]) globalCountData[id] = 0;
  globalCountData[id]++;
  await saveCountData();
  renderCount(id);
}

// 渲染单个次数
function renderCount(id) {
  const num = globalCountData[id] || 0;
  document.getElementById("cnt_"+id).innerText = "已下载：" + num + " 次";
}

// 渲染当前页
function renderGallery(page) {
  currentPage = page;
  const totalPages = Math.ceil(allItems.length / pageSize);
  const start = (page - 1) * pageSize;
  const end = start + pageSize;
  document.getElementById('contentWrap').innerHTML = allItems.slice(start, end).join('');
  
  let html = '';
  if (page > 1) html += `<a onclick="renderGallery(${page-1})">上一页</a>`;
  for (let i = 1; i <= totalPages; i++) {
    html += `<a class="${i===page?'active':''}" onclick="renderGallery(${i})">${i}</a>`;
  }
  if (page < totalPages) html += `<a onclick="renderGallery(${page+1})">下一页</a>`;
  document.getElementById('pagination').innerHTML = html;
}
